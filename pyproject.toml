[project]
name = "german-tutor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "dotenv>=0.9.9",
    "langchain-openai>=1.2.1",
    "langgraph==1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pydantic-settings>=2.0.0",
    "requests>=2.33.1",
    "ruff>=0.15.12",
    "spacy>=3.8.14",
    "streamlit>=1.57.0",
    "weaviate-client>=4.0.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
